spring.application.name=shared-list

# H2 Database Configuration (Archivo persistente para producción)
spring.datasource.url=jdbc:h2:file:./data/shared-list-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (solo en desarrollo)
spring.h2.console.enabled=false

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Configuration
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.TFG.shared_list=DEBUG

