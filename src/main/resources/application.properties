spring.application.name=shared-list

# Puerto dinámico para Heroku
server.port=${PORT:8080}

# H2 Database Configuration
# En producción: memoria (Heroku no permite archivos persistentes)
spring.datasource.url=jdbc:h2:mem:shared-list-db
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (deshabilitado en producción)
spring.h2.console.enabled=false

# H2 Console (deshabilitado en producción)
spring.h2.console.enabled=false

# Puerto dinámico para la nube
server.port=${PORT:8080}

# JPA Configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Server Configuration
server.port=${PORT:8080}

# Logging
logging.level.root=INFO
logging.level.TFG.shared_list=DEBUG

